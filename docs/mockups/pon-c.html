<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポン（案C）の見本</title>
<style>
:root { --cream:#FFF6E5; --paper:#FFFDF8; --ink:#4A2E1C; --soft:#8A6A55; --night:#2A1D14; }
body { margin:0; background:var(--cream); color:var(--ink); font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif; padding:16px; }
h1 { font-size:22px; margin:0 0 4px; }
p { color:var(--soft); margin:0 0 14px; }
.row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
button { font:inherit; padding:6px 12px; border:2px solid var(--ink); border-radius:999px; background:var(--paper); color:var(--ink); }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px; margin:16px 0; }
.grid figure { margin:0; text-align:center; background:var(--paper); border-radius:18px; padding:8px 0 6px; }
.grid figcaption { font-size:13px; color:var(--soft); }
.grid .mascot { width:140px; margin:0 auto; }
.big { display:flex; gap:20px; align-items:end; flex-wrap:wrap; }
.big .mascot { width:200px; }
.dark { background:var(--night); padding:12px; border-radius:16px; }
.mascot svg { width:100%; height:auto; display:block; overflow:visible; }

/* ===== ポン（案C）の絵のきまり（アプリの mascot/pon.css にこのまま写す） ===== */
.pon .eyes > g, .pon .think, .pon .chin, .pon .drop, .pon .zzz { display: none; }
.pon .eyes > .e-open { display: inline; }
.pon .cheek { opacity: .5; transition: opacity .2s; }
.pon .belly { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .3s; }
.pon .body-g { transform-box: view-box; transform-origin: 50% 92%; transition: transform .25s; }
.pon .wing { transform-box: fill-box; transform-origin: 50% 80%; transition: transform .25s; }
.pon .hat { transform-box: view-box; transform-origin: 50% 46%; transition: transform .25s; }

[data-mood="thinking"] .pon .eyes > g { display: none; }
[data-mood="thinking"] .pon .eyes > .e-up { display: inline; }
[data-mood="thinking"] .pon .think, [data-mood="thinking"] .pon .chin { display: inline; }
[data-mood="thinking"] .pon .body-g { transform: rotate(-7deg); }

[data-mood="decided"] .pon .eyes > g { display: none; }
[data-mood="decided"] .pon .eyes > .e-star { display: inline; }
[data-mood="decided"] .pon .cheek { opacity: .8; }
[data-mood="decided"] .pon .wing.r { transform: translate(6px, -14px) rotate(-60deg); }

[data-mood="happy"] .pon .eyes > g, [data-mood="full"] .pon .eyes > g { display: none; }
[data-mood="happy"] .pon .eyes > .e-smile, [data-mood="full"] .pon .eyes > .e-smile { display: inline; }
[data-mood="happy"] .pon .cheek, [data-mood="full"] .pon .cheek { opacity: .8; }

[data-mood="sad"] .pon .eyes > g { display: none; }
[data-mood="sad"] .pon .eyes > .e-sad { display: inline; }
[data-mood="sad"] .pon .drop { display: inline; }
[data-mood="sad"] .pon .hat { transform: rotate(-6deg) translateY(4px); }
[data-mood="sad"] .pon .cheek { opacity: .3; }

[data-mood="sleepy"] .pon .eyes > g { display: none; }
[data-mood="sleepy"] .pon .eyes > .e-sleepy { display: inline; }
[data-mood="sleepy"] .pon .zzz { display: inline; }
[data-mood="sleepy"] .pon .hat { transform: rotate(5deg); }

/* おなかの段階：体ごと少し横に広がり、淡いおなかがふくらむ */
[data-belly="1"] .pon .body-g { transform: scale(1.04, 1); }
[data-belly="2"] .pon .body-g { transform: scale(1.08, 1); }
[data-belly="3"] .pon .body-g { transform: scale(1.13, 1); }
[data-belly="1"] .pon .belly { transform: scale(1.1); }
[data-belly="2"] .pon .belly { transform: scale(1.22); }
[data-belly="3"] .pon .belly { transform: scale(1.36); }
[data-mood="thinking"][data-belly] .pon .body-g { transform: rotate(-7deg); }

/* 動き */
.mascot svg { transform-origin: 50% 92%; animation: pon-breathe 3.2s ease-in-out infinite; }
[data-mood="thinking"] svg { animation: pon-ponder 2.4s ease-in-out infinite; }
[data-mood="thinking"] .pon .think { animation: pon-float 2.4s ease-in-out infinite; }
[data-mood="decided"] svg { animation: pon-hop .6s cubic-bezier(.3,1.4,.5,1) 1; }
[data-mood="happy"] svg { animation: pon-bounce .45s ease-out 2; }
[data-mood="full"] svg { animation: pon-sway 1.6s ease-in-out infinite; }
[data-mood="sad"] svg { animation: none; transform: translateY(3px); }
[data-mood="sleepy"] svg { animation: pon-breathe 4.5s ease-in-out infinite; }
[data-mood="sleepy"] .pon .zzz { animation: pon-zzz 2.4s ease-in-out infinite; }
@keyframes pon-breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.02,.98); } }
@keyframes pon-ponder { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
@keyframes pon-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes pon-hop { 0% { transform: translateY(0) scale(1,1); } 25% { transform: translateY(2px) scale(1.08,.9); } 55% { transform: translateY(-18px) scale(.96,1.06); } 80% { transform: translateY(0) scale(1.04,.96); } 100% { transform: translateY(0) scale(1,1); } }
@keyframes pon-bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes pon-sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes pon-zzz { 0% { opacity:0; transform: translate(0,0); } 30% { opacity:1; } 100% { opacity:0; transform: translate(4px,-8px); } }
@media (prefers-reduced-motion: reduce) { .mascot svg, .pon * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<h1>ポン（案C）の見本</h1>
<p>7つの表情とおなかの段階。ボタンで動きも見られます。</p>
<div class="row" id="moods"></div>
<div class="row"><button data-b="0">おなか0</button><button data-b="1">1</button><button data-b="2">2</button><button data-b="3">3</button></div>
<div class="big">
  <div class="mascot" id="m" data-mood="normal" data-belly="0"></div>
  <div class="dark"><div class="mascot" id="d" data-mood="normal" data-belly="0" style="width:140px"></div></div>
  <div><div class="mascot" id="s" data-mood="normal" data-belly="0" style="width:72px"></div></div>
</div>
<div class="grid" id="grid"></div>

<script>
// ===== ポン（案C）の絵（アプリの mascot/pon.ts にこのまま写す） =====
const PON = `
<svg class="pon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <ellipse class="shadow" cx="100" cy="186" rx="58" ry="7" fill="#000" opacity=".08"/>
  <g class="body-g">
    <ellipse class="foot" cx="74" cy="180" rx="12" ry="7" fill="#FF9A57"/>
    <ellipse class="foot" cx="126" cy="180" rx="12" ry="7" fill="#FF9A57"/>
    <path class="body" d="M100 74 C154 74 176 108 176 138 C176 170 148 184 100 184 C52 184 24 170 24 138 C24 108 46 74 100 74 Z" fill="#FFD95E"/>
    <path class="body-shade" d="M28 150 C40 172 66 180 100 180 C134 180 160 172 172 150 C168 170 144 184 100 184 C56 184 32 170 28 150 Z" fill="#F7C743"/>
    <ellipse class="belly" cx="100" cy="164" rx="34" ry="14" fill="#FFE89A"/>
    <g class="wing l"><ellipse cx="34" cy="138" rx="10" ry="16" transform="rotate(20 34 138)" fill="#F7C743"/></g>
    <g class="wing r"><ellipse cx="166" cy="138" rx="10" ry="16" transform="rotate(-20 166 138)" fill="#F7C743"/></g>
    <g class="hat">
      <path d="M40 80 C26 76 22 48 46 46 C46 22 78 14 90 32 C100 10 136 12 140 34 C162 28 178 54 160 80 Z" fill="#FFFFFF" stroke="#E2CFAF" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M50 74 C70 64 130 64 150 74 L160 80 L40 80 Z" fill="#EFE4D2"/>
      <rect x="40" y="76" width="120" height="16" rx="8" fill="#FFFFFF" stroke="#E2CFAF" stroke-width="2.5"/>
      <rect x="40" y="86" width="120" height="6" rx="3" fill="#EFE4D2"/>
    </g>
    <ellipse class="cheek" cx="58" cy="136" rx="12" ry="7" fill="#FF8C7A"/>
    <ellipse class="cheek" cx="142" cy="136" rx="12" ry="7" fill="#FF8C7A"/>
    <g class="eyes">
      <g class="e-open">
        <circle cx="72" cy="124" r="5.2" fill="#3B2614"/><circle cx="70.4" cy="122.2" r="1.7" fill="#fff"/>
        <circle cx="128" cy="124" r="5.2" fill="#3B2614"/><circle cx="126.4" cy="122.2" r="1.7" fill="#fff"/>
      </g>
      <g class="e-up">
        <circle cx="69.6" cy="121" r="4.6" fill="#3B2614"/><circle cx="68.4" cy="119.4" r="1.5" fill="#fff"/>
        <circle cx="125.6" cy="121" r="4.6" fill="#3B2614"/><circle cx="124.4" cy="119.4" r="1.5" fill="#fff"/>
      </g>
      <g class="e-smile" fill="none" stroke="#3B2614" stroke-width="3.6" stroke-linecap="round">
        <path d="M64 126 Q72 117 80 126"/><path d="M120 126 Q128 117 136 126"/>
      </g>
      <g class="e-sad">
        <circle cx="72" cy="126" r="4.6" fill="#3B2614"/><circle cx="70.8" cy="124.6" r="1.5" fill="#fff"/>
        <circle cx="128" cy="126" r="4.6" fill="#3B2614"/><circle cx="126.8" cy="124.6" r="1.5" fill="#fff"/>
        <path d="M63 119 L79 114" fill="none" stroke="#3B2614" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M137 119 L121 114" fill="none" stroke="#3B2614" stroke-width="2.6" stroke-linecap="round"/>
      </g>
      <g class="e-sleepy" fill="none" stroke="#3B2614" stroke-width="3.4" stroke-linecap="round">
        <path d="M64 124 Q72 130 80 124"/><path d="M120 124 Q128 130 136 124"/>
      </g>
      <g class="e-star" fill="#3B2614">
        <path d="M72 115 l2.6 5.4 5.9 .7 -4.4 4 1.2 5.9 -5.3 -3 -5.3 3 1.2 -5.9 -4.4 -4 5.9 -.7z"/>
        <path d="M128 115 l2.6 5.4 5.9 .7 -4.4 4 1.2 5.9 -5.3 -3 -5.3 3 1.2 -5.9 -4.4 -4 5.9 -.7z"/>
      </g>
    </g>
    <path class="beak" d="M94 134 Q100 130 106 134 Q103 141 100 142 Q97 141 94 134 Z" fill="#FF9A57"/>
    <path class="chin" d="M118 140 c-10 -4 -18 4 -14 12 c4 6 14 6 18 -2 c2 -4 0 -8 -4 -10 z" fill="#F7C743"/>
    <path class="drop" d="M140 128 q5 8 0 11 q-5 -3 0 -11z" fill="#9FD4F0"/>
  </g>
  <g class="think">
    <circle cx="132" cy="48" r="3" fill="#FFFFFF" stroke="#D9C4A2" stroke-width="2"/>
    <circle cx="141" cy="38" r="5" fill="#FFFFFF" stroke="#D9C4A2" stroke-width="2"/>
    <path d="M142 20 c-2 -12 14 -18 20 -9 c5 -9 22 -6 21 6 c10 2 9 17 -2 18 c-3 9 -18 9 -21 2 c-10 4 -22 -6 -18 -17 z" fill="#FFFFFF" stroke="#D9C4A2" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M157 18 c0 -6 10 -6 10 0 c0 4 -5 4 -5 9" fill="none" stroke="#8A6A55" stroke-width="3" stroke-linecap="round"/>
    <circle cx="162" cy="33" r="2" fill="#8A6A55"/>
  </g>
  <g class="zzz" fill="none" stroke="#8A6A55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M156 64 h10 l-10 10 h10"/>
    <path d="M170 48 h7 l-7 7 h7"/>
  </g>
</svg>`;

const MOODS = [['normal','ふつう'],['thinking','考え中'],['decided','決めた！'],['happy','うれしい'],['full','おなかいっぱい'],['sad','しょんぼり'],['sleepy','眠い']];
const ids = ['m','d','s'];
for (const id of ids) document.getElementById(id).innerHTML = PON;
const row = document.getElementById('moods');
for (const [k, label] of MOODS) {
  const b = document.createElement('button'); b.textContent = label;
  b.onclick = () => { for (const id of ids) { const el = document.getElementById(id); el.dataset.mood = ''; void el.offsetWidth; el.dataset.mood = k; } };
  row.appendChild(b);
}
document.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { for (const id of ids) document.getElementById(id).dataset.belly = b.dataset.b; });
const grid = document.getElementById('grid');
for (const [k, label] of MOODS) {
  const f = document.createElement('figure');
  f.innerHTML = `<div class="mascot" data-mood="${k}" data-belly="${k === 'full' ? 3 : 0}">${PON}</div><figcaption>${label}</figcaption>`;
  grid.appendChild(f);
}
</script>
</body>
</html>
