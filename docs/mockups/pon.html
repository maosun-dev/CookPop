<!doctype html>
<html lang="ja" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポンの見本</title>
<style>
:root { --cream:#FFF6E5; --paper:#FFFDF8; --ink:#4A2E1C; --ink-soft:#8A6A55; --yolk:#FFC43D; --yolk-deep:#E8A617; --apricot:#FF8A5B; --leaf:#7FC98F; --egg-white:#FFFDF8; }
:root[data-theme="dark"] { --cream:#2A1D14; --paper:#3A2A1E; --ink:#FFF1DC; --ink-soft:#C9B4A3; }
body { margin:0; background:var(--cream); color:var(--ink); font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif; padding:16px; }
.row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
button { font:inherit; padding:6px 12px; border:2px solid var(--ink); border-radius:999px; background:var(--paper); color:var(--ink); }
.stage { display:flex; gap:24px; flex-wrap:wrap; align-items:flex-end; }
.mascot { width:160px; }
.mascot svg { width:100%; height:auto; display:block; overflow:visible; }
.small .mascot { width:40px; }

/* ===== ポンの絵のきまり（計画3でこのまま style.css / pon.ts に入れる） ===== */
.pon { --pon-ink: #4A2E1C; }               /* 線はテーマに関係なくこげ茶（卵黄の上に載るので） */
.pon .line { stroke: var(--pon-ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.pon .thin { stroke: var(--pon-ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.pon .body { fill: var(--yolk); }
.pon .belly { fill: var(--egg-white); transform-origin: 60px 84px; transition: transform .3s; }
.pon .hat { fill: var(--egg-white); }
.pon .beak { fill: var(--apricot); }
.pon .foot { fill: var(--apricot); }
.pon .cheek { fill: var(--apricot); opacity: 0; transition: opacity .2s; }
.pon .shadow { fill: var(--pon-ink); opacity: .12; }
.pon .eye-dot { fill: var(--pon-ink); }
.pon .eye-hi { fill: #fff; }
.pon .wing { fill: var(--yolk); transform-origin: 30px 72px; transition: transform .25s; }
.pon .wing.r { transform-origin: 90px 72px; }
.pon .zzz { fill: none; stroke: var(--pon-ink); stroke-width: 2.2; stroke-linecap: round; opacity: 0; }
.pon .drop { fill: var(--leaf); opacity: 0; }

/* 目のきりかえ：ふつう／ぐるぐる／にっこり／とじ／しょんぼり／ねむい */
.pon .eyes > g { display: none; }
.pon .eyes > .e-open { display: inline; }
[data-mood="thinking"] .pon .eyes > g { display: none; }
[data-mood="thinking"] .pon .eyes > .e-spiral { display: inline; }
[data-mood="happy"] .pon .eyes > g, [data-mood="full"] .pon .eyes > g { display: none; }
[data-mood="happy"] .pon .eyes > .e-smile, [data-mood="full"] .pon .eyes > .e-smile { display: inline; }
[data-mood="sad"] .pon .eyes > g { display: none; }
[data-mood="sad"] .pon .eyes > .e-sad { display: inline; }
[data-mood="sleepy"] .pon .eyes > g { display: none; }
[data-mood="sleepy"] .pon .eyes > .e-sleepy { display: inline; }
[data-mood="decided"] .pon .eyes > g { display: none; }
[data-mood="decided"] .pon .eyes > .e-star { display: inline; }

[data-mood="happy"] .pon .cheek, [data-mood="full"] .pon .cheek, [data-mood="decided"] .pon .cheek { opacity: .75; }
[data-mood="sleepy"] .pon .zzz { opacity: 1; }
[data-mood="sad"] .pon .drop { opacity: 1; }
[data-mood="decided"] .pon .wing.r { transform: rotate(-110deg) translate(2px, -2px); }
[data-mood="sad"] .pon .wing { transform: rotate(12deg); }
[data-mood="sad"] .pon .wing.r { transform: rotate(-12deg); }

/* おなかの段階 */
[data-belly="1"] .pon .belly { transform: scale(1.08); }
[data-belly="2"] .pon .belly { transform: scale(1.18); }
[data-belly="3"] .pon .belly { transform: scale(1.3); }

/* 動き（マスコットの svg 全体を動かす） */
.mascot svg { transform-origin: 50% 87%; animation: pon-breathe 3.2s ease-in-out infinite; }
[data-mood="thinking"] svg { animation: pon-wobble .55s ease-in-out infinite; }
[data-mood="thinking"] .pon .e-spiral g { transform-origin: center; transform-box: fill-box; animation: pon-spin .9s linear infinite; }
[data-mood="decided"] svg { animation: pon-hop .6s cubic-bezier(.3,1.4,.5,1) 1; }
[data-mood="happy"] svg { animation: pon-bounce .45s ease-out 2; }
[data-mood="full"] svg { animation: pon-sway 1.6s ease-in-out infinite; }
[data-mood="sad"] svg { animation: none; transform: translateY(3px); }
[data-mood="sleepy"] svg { animation: pon-breathe 4.5s ease-in-out infinite; }
[data-mood="sleepy"] .pon .zzz { animation: pon-zzz 2.4s ease-in-out infinite; }
@keyframes pon-breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.015,.985); } }
@keyframes pon-wobble { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@keyframes pon-spin { to { transform: rotate(360deg); } }
@keyframes pon-hop { 0% { transform: translateY(0) scale(1,1); } 25% { transform: translateY(2px) scale(1.08,.9); } 55% { transform: translateY(-18px) scale(.96,1.06); } 80% { transform: translateY(0) scale(1.04,.96); } 100% { transform: translateY(0) scale(1,1); } }
@keyframes pon-bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes pon-sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes pon-zzz { 0% { opacity:0; transform: translate(0,0); } 30% { opacity:1; } 100% { opacity:0; transform: translate(4px,-8px); } }
@media (prefers-reduced-motion: reduce) { .mascot svg, .pon * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="row" id="moods"></div>
<div class="row"><button data-belly="0">おなか0</button><button data-belly="1">1</button><button data-belly="2">2</button><button data-belly="3">3</button><button id="theme">暗い/明るい</button></div>
<div class="stage">
  <div class="mascot" id="m" data-mood="normal" data-belly="0"></div>
  <div class="small"><div class="mascot" id="s" data-mood="normal" data-belly="0"></div></div>
</div>

<script>
const PON = `
<svg class="pon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <ellipse class="shadow" cx="60" cy="110" rx="30" ry="4"/>
  <!-- 足 -->
  <ellipse class="foot line" cx="49" cy="105" rx="7" ry="3.5"/>
  <ellipse class="foot line" cx="71" cy="105" rx="7" ry="3.5"/>
  <!-- 羽 -->
  <path class="wing line" d="M30 70 C18 72 16 86 28 90 C32 84 32 76 30 70 Z"/>
  <path class="wing r line" d="M90 70 C102 72 104 86 92 90 C88 84 88 76 90 70 Z"/>
  <!-- 体 -->
  <circle class="body line" cx="60" cy="72" r="34"/>
  <!-- おなか -->
  <ellipse class="belly" cx="60" cy="84" rx="19" ry="14"/>
  <!-- ほっぺ -->
  <circle class="cheek" cx="40" cy="74" r="4.5"/>
  <circle class="cheek" cx="80" cy="74" r="4.5"/>
  <!-- 目 -->
  <g class="eyes">
    <g class="e-open">
      <circle class="eye-dot" cx="47" cy="64" r="4.2"/><circle class="eye-dot" cx="73" cy="64" r="4.2"/>
      <circle class="eye-hi" cx="48.6" cy="62.4" r="1.5"/><circle class="eye-hi" cx="74.6" cy="62.4" r="1.5"/>
    </g>
    <g class="e-spiral">
      <g><path class="thin" d="M47 64 m0 -4 a4 4 0 1 1 -4 4 a2.4 2.4 0 1 0 2.4 -2.4"/></g>
      <g><path class="thin" d="M73 64 m0 -4 a4 4 0 1 1 -4 4 a2.4 2.4 0 1 0 2.4 -2.4"/></g>
    </g>
    <g class="e-smile">
      <path class="thin" d="M42 65 q5 -6 10 0"/><path class="thin" d="M68 65 q5 -6 10 0"/>
    </g>
    <g class="e-sad">
      <circle class="eye-dot" cx="47" cy="65" r="3.6"/><circle class="eye-dot" cx="73" cy="65" r="3.6"/>
      <path class="thin" d="M41 61 l9 -3"/><path class="thin" d="M79 61 l-9 -3"/>
    </g>
    <g class="e-sleepy">
      <path class="thin" d="M42 64 q5 3 10 0"/><path class="thin" d="M68 64 q5 3 10 0"/>
    </g>
    <g class="e-star">
      <path class="eye-dot" d="M47 59 l1.6 3.4 3.6 .4 -2.7 2.5 .8 3.6 -3.3 -1.9 -3.3 1.9 .8 -3.6 -2.7 -2.5 3.6 -.4z"/>
      <path class="eye-dot" d="M73 59 l1.6 3.4 3.6 .4 -2.7 2.5 .8 3.6 -3.3 -1.9 -3.3 1.9 .8 -3.6 -2.7 -2.5 3.6 -.4z"/>
    </g>
  </g>
  <!-- くちばし -->
  <path class="beak line" d="M55 70 L65 70 L60 77 Z"/>
  <!-- 帽子 -->
  <path class="hat line" d="M44 42 C36 40 36 26 46 26 C46 16 60 14 62 24 C66 14 82 18 78 28 C86 28 86 42 76 42 Z"/>
  <rect class="hat line" x="42" y="40" width="36" height="8" rx="3"/>
  <!-- zzz（眠いとき） -->
  <path class="zzz" d="M90 42 h7 l-7 7 h7"/>
  <!-- 涙（しょんぼり） -->
  <path class="drop" d="M79 69 q3 5 0 7 q-3 -2 0 -7z"/>
</svg>`;
const MOODS = ['normal','thinking','decided','happy','full','sad','sleepy'];
const m = document.getElementById('m'), s = document.getElementById('s');
m.innerHTML = PON; s.innerHTML = PON;
const row = document.getElementById('moods');
for (const k of MOODS) { const b = document.createElement('button'); b.textContent = k; b.onclick = () => { m.dataset.mood = ''; void m.offsetWidth; m.dataset.mood = k; s.dataset.mood = k; }; row.appendChild(b); }
document.querySelectorAll('[data-belly]').forEach(b => b.onclick = () => { m.dataset.belly = b.dataset.belly; s.dataset.belly = b.dataset.belly; });
document.getElementById('theme').onclick = () => { const h = document.documentElement; h.dataset.theme = h.dataset.theme === 'dark' ? '' : 'dark'; };
</script>
</body>
</html>
