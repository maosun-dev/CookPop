<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ストアの画面写真</title>
<!-- App Store の画面写真（6.9 インチ用 1320×2868）を1枚ずつ描くページ。?n=1〜5 で番号を選ぶ。
     実機の画面は docs/store/raw/<番号>.png。ふきんの色は1枚ごとに変えて、6色あることも見せる -->
<style>
@font-face { font-family: "Zen Maru Gothic"; font-weight: 900; src: url("../../node_modules/@fontsource/zen-maru-gothic/files/zen-maru-gothic-japanese-900-normal.woff2") format("woff2"); }
@font-face { font-family: "Zen Maru Gothic"; font-weight: 700; src: url("../../node_modules/@fontsource/zen-maru-gothic/files/zen-maru-gothic-japanese-700-normal.woff2") format("woff2"); }
html, body { margin: 0; width: 1320px; height: 2868px; overflow: hidden; }
body {
  --cloth: 255, 196, 61;
  background-color: #FFF8EC;
  /* アプリの地と同じギンガム。写真では格子を大きめに */
  background-image: linear-gradient(90deg, rgba(var(--cloth), .30) 50%, transparent 50%), linear-gradient(rgba(var(--cloth), .30) 50%, transparent 50%);
  background-size: 120px 120px;
  font-family: "Zen Maru Gothic", sans-serif; color: #4A2E1C;
}
/* 一言は白いメモに書いて、テープで留める（傾けるのはテープだけ） */
.memo { position: absolute; left: 110px; right: 110px; top: 150px; padding: 64px 56px 60px; background: #fff; border-radius: 10px;
  box-shadow: 0 8px 0 rgba(74, 46, 28, .12); text-align: center; }
.memo::before { content: ""; position: absolute; left: 50%; top: -34px; width: 300px; height: 72px; margin-left: -150px;
  background: rgba(var(--cloth), .75); transform: rotate(-3deg); }
.memo h1 { margin: 0; font-size: 104px; line-height: 1.32; font-weight: 900; letter-spacing: .02em; }
.memo p { margin: 22px 0 0; font-size: 52px; font-weight: 700; color: #7A5A44; }
/* 実機の画面：まっすぐ、角を丸め、下に平たい影 */
.shot { position: absolute; left: 50%; top: 700px; width: 1000px; margin-left: -500px; border-radius: 72px; overflow: hidden;
  box-shadow: 0 14px 0 rgba(74, 46, 28, .16); background: #eee; }
.shot img { display: block; width: 100%; }
.blur { position: absolute; backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); }
.missing { height: 2173px; display: grid; place-items: center; font-size: 60px; color: #999; }
</style>
</head>
<body>
<div class="memo"><h1 id="t"></h1><p id="s"></p></div>
<div class="shot" id="shot"></div>
<script>
// 一言（上が大きな見出し。| で改行。下が小さな説明）とふきんの色。文言は docs/store/listing.md と同じ
const SHOTS = {
  1: { t: '今日の献立、|ポンが決めるよ', s: '「きめて！」を押すだけ', cloth: '125, 184, 106' },
  2: { t: '料理動画を|献立帳にまとめる', s: 'ジャンルで絞り込める', cloth: '108, 184, 224',
       // 他の人の動画のサムネイル（顔や文字）はぼかす。位置は実機の画面に対する割合（左, 上, 幅, 高さ）
       blur: [[5.8, 36.7, 41, 10.6], [53.2, 36.7, 41, 10.6], [5.8, 58.8, 41, 10.6], [53.2, 58.8, 41, 10.6], [5.8, 80.9, 41, 7.2], [53.2, 80.9, 41, 7.2]] },
  3: { t: '作った日は|カレンダーに', s: 'よく作る順・しばらく作ってない順も', cloth: '255, 157, 181' },
};
const n = Number(new URLSearchParams(location.search).get('n') || 1);
const d = SHOTS[n];
document.body.style.setProperty('--cloth', d.cloth);
const t = document.getElementById('t');
d.t.split('|').forEach((line, i) => { if (i) t.append(document.createElement('br')); t.append(line); });
document.getElementById('s').textContent = d.s;
const img = new Image();
img.alt = '';
img.onload = () => {
  const box = document.getElementById('shot');
  box.append(img);
  for (const [l, t2, w, h] of d.blur || []) {
    const b = document.createElement('div');
    b.className = 'blur';
    b.style.cssText = `left:${l}%;top:${t2}%;width:${w}%;height:${h}%`;
    box.append(b);
  }
};
img.onerror = () => { const m = document.createElement('div'); m.className = 'missing'; m.textContent = `docs/store/raw/${n}.png がまだ無い`; document.getElementById('shot').append(m); };
img.src = `../../docs/store/raw/${n}.png`;
</script>
</body>
</html>
